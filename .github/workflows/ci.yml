name: ci

# Phase 0 CI skeleton (ROADMAP §5): lint, test, and measure on every push and PR.
#
# Two things here are deliberate and easy to mistake for gaps:
#
#  * Benchmarks are *recorded*, not gated, on GitHub-hosted runners. A baseline
#    is host-specific - the committed baselines were measured on a 2-vCPU Linux
#    box and a hosted runner is a different machine, so gating against them would
#    produce noise, not signal. The gate job below runs only when a baseline
#    recorded on the same runner label is present.
#  * The browser job is `continue-on-error` until it has been green once on a
#    real runner. It is the only place the Spike A numbers get validated outside
#    V8-in-Node, so it should become blocking as soon as it is trustworthy.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 288 tests, including the JIT differential corpus run under eight engine
      # configurations. A failure here is a correctness failure, not a flake.
      - run: npm test
      - name: Report engine capabilities
        run: npx tsx benchmarks/src/cli.ts run --suite wasm --reps 1 --quick

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Measure every suite
        run: npm run bench:record -- --all --reps 5
      - name: Render the report
        run: npm run report -- --md --out kpi-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            benchmarks/results/*.json
            kpi-report.md
          if-no-files-found: error
      - name: Gate against a baseline for this runner, if one exists
        run: |
          if [ -f benchmarks/baselines/ci-ubuntu-latest-jit.json ]; then
            cp benchmarks/baselines/ci-ubuntu-latest-jit.json benchmarks/baselines/jit.json
            npm run bench:gate -- --suite jit
          else
            echo "no baseline recorded for ubuntu-latest; skipping the gate."
            echo "record one with: npm run bench:record -- --suite jit --baseline"
            echo "then commit it as benchmarks/baselines/ci-ubuntu-latest-jit.json"
          fi

  browser:
    runs-on: ubuntu-latest
    needs: test
    # See the note at the top: make this blocking once it has been green once.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Cross-origin isolated (the runner sets COOP/COEP), so SharedArrayBuffer
      # and Wasm atomics exist and the atomics case measures the real path.
      - name: Measure in Chromium
        run: npm run bench:browser -- --suite jit,wasm --reps 5 --out browser-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-browser-${{ github.sha }}
          path: browser-report.json
          if-no-files-found: warn
